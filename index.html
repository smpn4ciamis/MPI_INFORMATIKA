                    { q: "Peta konsep yang bercabang ke subtopik menggunakan struktur...", options: ["Graph", "Tree", "Node", "Edge"], a: 1 },

        const state = {
            currentState: GameState.HOME,

            badges: [],

            l5_completed: 0,

            timeLeft: 0, 
            timerInterval: null,

        const totalLevels = 8;

        // --- STREAMING_CHUNK:Sistem Timer Setup... ---
        function startTimer(seconds, timeoutCallback) {
            clearInterval(state.timerInterval);
            state.timeLeft = seconds;
            state.currentTimeoutCallback = timeoutCallback;
            document.getElementById('timer-container').classList.remove('hidden-el');
            updateTimerUI();
            
            state.timerInterval = setInterval(() => {
                state.timeLeft--;
                updateTimerUI();
                if (state.timeLeft <= 0) {
                    clearInterval(state.timerInterval);
                    if (state.currentTimeoutCallback) state.currentTimeoutCallback();
                }
            }, 1000);
        }

        function stopTimer() {
            clearInterval(state.timerInterval);
            document.getElementById('timer-container').classList.add('hidden-el');
        }

        function pauseTimer() {
            clearInterval(state.timerInterval);
        }

        function resumeTimer() {
            if (state.timeLeft > 0 && !document.getElementById('timer-container').classList.contains('hidden-el')) {
                state.timerInterval = setInterval(() => {
                    state.timeLeft--;
                    updateTimerUI();
                    if (state.timeLeft <= 0) {
                        clearInterval(state.timerInterval);
                        if (state.currentTimeoutCallback) state.currentTimeoutCallback();
                    }
                }, 1000);
            }
        }

        function updateTimerUI() {
            const timerEl = document.getElementById('hud-timer');
            const container = document.getElementById('timer-container');
            
            // Efek panik merah jika <= 10 detik
            if (state.timeLeft <= 10 && state.timeLeft > 0) {
                container.classList.remove('bg-blue-100', 'text-blue-600', 'border-blue-200');
                container.classList.add('bg-red-100', 'text-red-600', 'border-red-200', 'pulse-danger');
            } else {
                container.classList.add('bg-blue-100', 'text-blue-600', 'border-blue-200');
                container.classList.remove('bg-red-100', 'text-red-600', 'border-red-200', 'pulse-danger');
            }

            const m = Math.floor(state.timeLeft / 60).toString().padStart(2, '0');
            const s = (state.timeLeft % 60).toString().padStart(2, '0');
            timerEl.innerText = `${m}:${s}`;
        }

        // --- STREAMING_CHUNK:HUD UI Logic... ---
        window.onload = function() {
            renderCurrentState();
        };

        function updateHUD() {
            document.getElementById('hud-name').innerText = state.playerName || "Player";
            document.getElementById('hud-group').innerText = `Klp ${state.groupId}`;
            document.getElementById('hud-xp').innerText = `${state.xp} XP`;
            document.getElementById('hud-badges').innerText = state.badges.length;
            
            const currentLevelNum = Object.keys(GameState).indexOf(state.currentState) - 1; 
            const progressPercent = Math.max(0, (currentLevelNum / totalLevels) * 100);
            document.getElementById('hud-progress').style.width = `${progressPercent}%`;

            if (state.currentState !== GameState.HOME && state.currentState !== GameState.RESULT) {
                document.getElementById('hud').classList.remove('hidden-el');
            } else {
                document.getElementById('hud').classList.add('hidden-el');
            }
        }

        function addXP(amount) {
            state.xp += amount;
            const xpEl = document.getElementById('hud-xp');
            xpEl.classList.add('pop', 'text-amber-500');
            setTimeout(() => xpEl.classList.remove('pop', 'text-amber-500'), 500);
            updateHUD();
        }

        function awardBadge(badge) {
            if (!state.badges.find(b => b.id === badge.id)) {
                state.badges.push(badge);
                
                const toast = document.getElementById('toast-badge');
                document.getElementById('toast-icon').innerText = badge.icon;
                document.getElementById('toast-name').innerText = badge.name;
                
                toast.classList.remove('hidden-el');
                setTimeout(() => {
                    toast.classList.remove('translate-x-[150%]');
                }, 50);
                
                setTimeout(() => {
                    toast.classList.add('translate-x-[150%]');
                    setTimeout(() => {
                        toast.classList.add('hidden-el');
                    }, 500);
                }, 4000);
                
                updateHUD();
            }
        }

        function showFeedback(isSuccess, message, title = "", onClose = null) {
            pauseTimer();
            const modal = document.getElementById('feedback-modal');
            const icon = document.getElementById('feedback-icon');
            const titleEl = document.getElementById('feedback-title');
            
            modal.classList.remove('hidden-el');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modal.querySelector('div').classList.remove('scale-95');
            }, 10);

            if (isSuccess) {
                icon.innerHTML = '<i class="fas fa-check-circle text-emerald-500 pop inline-block"></i>';
                titleEl.className = "text-2xl font-black text-emerald-600 mb-2";
                titleEl.innerText = title || "Benar!";
            } else {
                icon.innerHTML = '<i class="fas fa-times-circle text-rose-500 pop inline-block"></i>';
                titleEl.className = "text-2xl font-black text-rose-600 mb-2";
                titleEl.innerText = title || "Belum Tepat";
            }
            
            document.getElementById('feedback-message').innerText = message;
            state.onFeedbackClose = onClose;
        }

        function closeFeedback() {
            const modal = document.getElementById('feedback-modal');
            modal.classList.add('opacity-0');
            modal.querySelector('div').classList.add('scale-95');
            
            setTimeout(() => {
                modal.classList.add('hidden-el');
                resumeTimer();
                if (state.onFeedbackClose) {
                    state.onFeedbackClose();
                    state.onFeedbackClose = null;
                }
            }, 300);

            document.getElementById('next-container').classList.add('hidden-el');
        }

            hideNextButton();
            state.currentState = newState;
            updateHUD();
            renderCurrentState();
        }

        function nextLevel() {
            const states = Object.keys(GameState);
            const currentIndex = states.indexOf(state.currentState);
            if (currentIndex < states.length - 1) {
                changeState(states[currentIndex + 1]);
            }
        }

        function resetGame() {
            stopTimer();
            state.currentState = GameState.HOME;
            state.xp = 0; state.badges = [];
            state.l1_completed = 0; state.l2_completed = 0; state.l3_completed = false;
            state.l4_completed = 0; state.l5_completed = 0; state.l6_completed = 0;
            state.final_quiz_score = 0;
            changeState(GameState.HOME);
        }

                case GameState.HOME: renderHome(container); break;

                case GameState.LEVEL1: renderLevel1(container); break;
                case GameState.LEVEL2: renderLevel2(container); break;
                case GameState.LEVEL3: renderLevel3(container); break;
                case GameState.LEVEL4: renderLevel4(container); break;
                case GameState.LEVEL5: renderLevel5(container); break;
                case GameState.LEVEL6: renderLevel6(container); break;
                case GameState.FINAL_MISSION: renderFinalMission(container); break;
                case GameState.FINAL_QUIZ: renderFinalQuiz(container); break;
                case GameState.RESULT: renderResult(container); break;
            }
        }

        window.startGame = function() {
            const nameInput = document.getElementById('player-name').value.trim();
            const groupInput = document.querySelector('input[name="group"]:checked').value;
            if (nameInput) {

            }

        function renderBriefing(container) {

            container.innerHTML = `

        // --- STREAMING_CHUNK:Level 1 Setup... ---
        function renderLevel1(container) {
            const dataExamples = gameVariations[state.groupId].l1;
            state.l1_completed = 0;

            startTimer(45, () => {

        window.checkL1 = function(index, isData, element) {

            element.querySelector('.desc-text').classList.remove('hidden-el');
            
            if (isData) {
                element.classList.remove('border-slate-100');
                element.classList.add('border-emerald-500', 'bg-emerald-50', 'opacity-50', 'cursor-not-allowed');
                element.onclick = null;
                addXP(10);
                state.l1_completed++;
                
                if (state.l1_completed === 1) {
                    showFeedback(true, "Tepat sekali! Masih ada 1 lagi data terstruktur di layar. Ayo temukan yang satu lagi!", "Satu Lagi! 🔍");
                } else if (state.l1_completed === 2) {
                    awardBadge(BADGES.BEGINNER);

                        showNextButton();
                    });
                }
            } else {
                element.classList.remove('border-slate-100');
                element.classList.add('border-rose-500', 'bg-rose-50', 'pulse-danger');
                setTimeout(() => {
                    element.classList.remove('pulse-danger', 'border-rose-500', 'bg-rose-50');
                    element.classList.add('border-slate-100');
                }, 1000);
                showFeedback(false, "Belum tepat. Data ini acak dan tidak memiliki pola, hubungan, atau struktur yang jelas.", "Coba Perhatikan Lagi");

        };

        // --- STREAMING_CHUNK:Level 2 Setup... ---

                    <div class="bg-white p-8 rounded-3xl shadow-xl flex justify-center border border-slate-100 overflow-x-auto relative">

                            <line x1="100" y1="120" x2="150" y2="200" stroke="#cbd5e1" stroke-width="6" />
                            <line x1="300" y1="120" x2="250" y2="200" stroke="#cbd5e1" stroke-width="6" />

                            <g class="svg-interactive group" onclick="checkL2('root', this)">

                                <text x="200" y="47" text-anchor="middle" font-weight="900" font-size="20" fill="#334155">A</text>

                                <text x="100" y="127" text-anchor="middle" font-weight="900" font-size="20" fill="#334155">B</text>

                            <g class="svg-interactive group" onclick="checkL2('parent', this)">

                                <text x="150" y="207" text-anchor="middle" font-weight="900" font-size="20" fill="#334155">E</text>

                    </div>

            `;

            window.checkL2 = function(type, el) {
                const typeNeeded = l2_tasks[state.l2_completed].type;
                let isCorrect = false;
                let explanation = "";

                if (typeNeeded === 'root' && type === 'root') { isCorrect = true; explanation = "Tepat! Root adalah simpul paling awal/teratas."; }
                else if (typeNeeded === 'leaf' && type === 'leaf') { isCorrect = true; explanation = "Benar! Leaf (Daun) adalah simpul ujung yang tidak memiliki anak."; }
                else if (typeNeeded === 'parent' && (type === 'parent' || type === 'root')) { isCorrect = true; explanation = "Bagus! Parent adalah simpul yang memiliki cabang ke bawah."; }

                if (isCorrect) {
                    el.querySelector('circle').setAttribute('fill', '#d1fae5'); 
                    el.querySelector('circle').setAttribute('stroke', '#10b981'); 
                    addXP(10);
                    state.l2_completed++;
                    
                    if (state.l2_completed < l2_tasks.length) {
                        showFeedback(true, explanation + ` Ayo lanjut ke tahap ${state.l2_completed + 1} dari 3.`, "Langkah Bagus! 🌳", () => {

        function renderFinalQuiz(container) {
            window.quiz_currentIndex = 0;
            window.quiz_data = gameVariations[state.groupId].quiz;
            renderQuizQuestion(container);
        }

        function renderQuizQuestion(container) {
            if (window.quiz_currentIndex >= window.quiz_data.length) {
                stopTimer();
                awardBadge(BADGES.MASTER);
                container.innerHTML = `
                    <div class="max-w-3xl mx-auto text-center slide-up mt-10 p-10 bg-white rounded-3xl shadow-xl border border-slate-100">
                        <div class="text-7xl mb-6 pop">🏁</div>
                        <h2 class="text-4xl font-black text-slate-800 mb-4">Ujian Selesai!</h2>
                        <p class="text-lg text-slate-600 font-medium bg-slate-50 p-4 rounded-xl border border-slate-100 mb-8">Selamat! Kamu telah menyelesaikan seluruh rangkaian misi dan kuis dengan sangat baik.</p>
                        <button onclick="nextLevel()" class="btn-3d btn-primary px-10 py-5 font-black text-xl rounded-full shadow-xl mx-auto flex items-center justify-center">
                            LIHAT HASIL AKHIR <i class="fas fa-trophy ml-3"></i>
                        </button>
                    </div>
                `;
                return;
            }

            startTimer(30, () => {
                 showFeedback(false, "Waktu habis untuk soal ini! Kamu kehilangan kesempatan poin XP kali ini.", "Waktu Habis ⏰", () => {
                     window.quiz_currentIndex++;
                     renderQuizQuestion(document.getElementById('game-container'));
                 });
            });

            const q = window.quiz_data[window.quiz_currentIndex];
            
            let html = `
                <div class="max-w-3xl mx-auto slide-up w-full">
                    <div class="text-center mb-8">
                        <span class="inline-block bg-slate-800 text-white font-bold px-4 py-1 rounded-full mb-3 text-sm tracking-widest uppercase shadow-md">Ujian Akhir</span>
                        <h2 class="text-4xl font-black text-slate-800">Kuis Final 🧠</h2>
                        <p class="text-slate-500 font-bold mt-2">Pertanyaan ${window.quiz_currentIndex + 1} dari ${window.quiz_data.length}</p>
                    </div>

                    <div class="bg-white p-8 sm:p-10 rounded-3xl shadow-xl mb-8 border border-slate-100">
                        <h3 class="text-2xl font-bold text-slate-800 leading-relaxed">${q.q}</h3>
                    </div>

                    <div class="grid gap-4">
            `;

            q.options.forEach((opt, idx) => {
                html += `
                    <button class="interactive-card bg-slate-50 border-2 border-slate-200 hover:border-indigo-500 hover:bg-indigo-50 hover:text-indigo-800 text-left p-5 rounded-2xl text-lg font-bold text-slate-700 transition-colors w-full flex items-center group" 
                            onclick="checkQuizAnswer(${idx})">
                        <span class="inline-flex items-center justify-center bg-white text-slate-600 rounded-lg w-10 h-10 mr-4 shadow-sm border border-slate-200 group-hover:bg-indigo-500 group-hover:text-white group-hover:border-indigo-600 transition-colors shrink-0">
                            ${String.fromCharCode(65+idx)}
                        </span>
                        <span>${opt}</span>
                    </button>
                `;
            });

            html += `</div></div>`;
            container.innerHTML = html;
        }

        window.checkQuizAnswer = function(selectedIndex) {
            stopTimer();
            const q = window.quiz_data[window.quiz_currentIndex];
            if (selectedIndex === q.a) {
                addXP(20);
                state.final_quiz_score += 20;
                showFeedback(true, "Jawaban kamu tepat!", "Benar!", () => {
                    window.quiz_currentIndex++;
                    renderQuizQuestion(document.getElementById('game-container'));
                });
            } else {
                showFeedback(false, `Jawaban yang benar adalah: ${q.options[q.a]}`, "Belum Tepat", () => {
                    window.quiz_currentIndex++;
                    renderQuizQuestion(document.getElementById('game-container'));
                });
            }
        };

        // --- STREAMING_CHUNK:Result Screen Setup... ---
        function renderResult(container) {
            container.className = "min-h-screen pt-20 pb-20 px-4 sm:px-6 flex flex-col items-center justify-center bg-cyber";
            
            let rank = "";
            const percent = Math.min(100, Math.round((state.xp / 220) * 100)); 

            if (percent >= 90) rank = "🏆 DATA MASTER";
            else if (percent >= 75) rank = "🥇 DATA EXPLORER";
            else if (percent >= 60) rank = "🥈 DATA ADVENTURER";
            else rank = "🌱 DATA BEGINNER";

            let html = `
                <div class="max-w-2xl mx-auto glass-panel p-8 sm:p-12 rounded-[3rem] shadow-2xl text-center slide-up relative overflow-hidden w-full border border-white/20">
                    <div class="text-7xl mb-6 pop">🎉</div>
                    <h2 class="text-4xl sm:text-5xl font-black text-slate-800 mb-2">Petualangan Selesai!</h2>
                    <p class="text-xl text-slate-600 font-bold mb-8 bg-white/50 inline-block px-6 py-2 rounded-full shadow-sm">${state.playerName} | Kelompok ${state.groupId}</p>

                    <div class="bg-indigo-50/80 rounded-3xl p-6 sm:p-8 mb-8 border-2 border-white/60 shadow-lg backdrop-blur-sm">
                        <h3 class="text-3xl font-black text-indigo-700 mb-6 drop-shadow-sm">${rank}</h3>
                        
                        <div class="grid grid-cols-2 gap-4 mb-6">
                            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center justify-center">
                                <p class="text-slate-400 text-sm font-bold uppercase mb-1">Total XP</p>
                                <p class="text-4xl font-black text-amber-500 drop-shadow-sm">${state.xp}</p>
                            </div>
                            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center justify-center">
                                <p class="text-slate-400 text-sm font-bold uppercase mb-1">Misi Selesai</p>
                                <p class="text-4xl font-black text-emerald-500 drop-shadow-sm">8/8</p>
                            </div>
                        </div>

                        <div class="text-left bg-white/60 p-5 rounded-2xl border border-white/50">
                            <p class="text-slate-500 text-sm font-bold uppercase mb-4 text-center tracking-widest">Koleksi Badge:</p>
                            <div class="flex flex-wrap justify-center gap-3">
            `;

            if (state.badges.length === 0) {
                html += `<span class='text-slate-400 italic font-medium'>Belum ada badge</span>`;
            } else {
                state.badges.forEach(b => {
                    html += `<div class="bg-white px-4 py-2 rounded-xl shadow-sm font-bold flex items-center gap-2 border border-slate-100 ${b.color} hover:-translate-y-1 transition-transform cursor-default">
                                <span class="text-xl">${b.icon}</span> <span>${b.name}</span>
                             </div>`;
                });
            }

            html += `
                            </div>
                        </div>
                    </div>

                    <p class="text-slate-700 font-medium text-lg mb-10 leading-relaxed px-4 bg-white/40 p-4 rounded-2xl border border-white/30">
                        Hebat! Kamu sudah memahami bagaimana <strong>Tree</strong> dan <strong>Graph</strong> digunakan untuk mengorganisasi data dan menyelesaikan masalah dalam komputasi.
                    </p>

                    <button onclick="resetGame()" class="btn-3d btn-primary px-10 py-5 text-xl font-black rounded-full w-full sm:w-auto shadow-xl">
                        <i class="fas fa-home mr-2"></i> KEMBALI KE HOME
                    </button>
                </div>
            `;
            container.innerHTML = html;
        }
    </script>
</body>
</html>
