            if(state.currentState === GameState.HOME || state.currentState === GameState.RESULT) {
                document.getElementById('hud').classList.add('hidden-el');
            } else {
                document.getElementById('hud').classList.remove('hidden-el');
                document.getElementById('hud-name').innerText = state.playerName;
                document.getElementById('hud-group').innerText = `Kelompok ${state.groupId}`;
                document.getElementById('hud-xp').innerText = `${state.xp} XP`;
                document.getElementById('hud-lives').innerText = state.lives;
                document.getElementById('hud-badges').innerText = state.badges.length;
                document.getElementById('hud-progress').style.width = `${state.progress}%`;
            }
        }

        function addXP(amount) {
            state.xp += amount;
            updateHUD();
        }

        function loseLife() {
            state.lives--;
            updateHUD();
            if (state.lives <= 0) {
                showFeedback(false, "Kamu kehabisan nyawa! Namun jangan menyerah, DATA EXPLORER tidak pernah menyerah.", "Game Over", () => {
                    resetGame();
                });
            }
        }

        function awardBadge(badge) {
            if (!state.badges.find(b => b.id === badge.id)) {
                state.badges.push(badge);
                updateHUD();
            }
        }

            state.currentState = GameState.HOME;

            hideNextButton();

            const currentIndex = stateOrder.indexOf(newState);
            if(currentIndex >= 0) {
                state.progress = Math.round((currentIndex / (stateOrder.length - 1)) * 100);
            }

            updateHUD();
            renderCurrentState();
        }

                case GameState.LEVEL3: changeState(GameState.LEVEL4); break;
                case GameState.LEVEL4: changeState(GameState.LEVEL5); break;
                case GameState.LEVEL5: changeState(GameState.LEVEL6); break;
                case GameState.LEVEL6: changeState(GameState.FINAL_MISSION); break;
                case GameState.FINAL_MISSION: changeState(GameState.FINAL_QUIZ); break;
                case GameState.FINAL_QUIZ: changeState(GameState.RESULT); break;

        function checkTreeClick(nodeId, el) {
            const typeNeeded = l2_tasks[state.l2_completed].type;
            let isCorrect = false;
            let explanation = "";
            
            if (typeNeeded === 'root') {
                if (nodeId === 'A') { isCorrect = true; explanation = "A adalah Root karena berada paling atas."; }
                else explanation = "Root selalu berada di ujung paling atas (Simpul A).";
            }
            else if (typeNeeded === 'parent') {
                if (['A', 'B', 'C'].includes(nodeId)) { isCorrect = true; explanation = `${nodeId} adalah Parent karena memiliki cabang ke bawah.`; }
                else explanation = "Parent harus memiliki simpul bawahan (cabang). A, B, atau C adalah contohnya.";
            }
            else if (typeNeeded === 'child') {
                if (['B', 'C', 'D', 'E', 'F', 'G'].includes(nodeId)) { isCorrect = true; explanation = `${nodeId} adalah Child karena merupakan turunan dari simpul di atasnya.`; }
                else explanation = "Semua simpul KECUALI Root (A) adalah Child dari simpul di atasnya.";
            }
            else if (typeNeeded === 'leaf') {
                if (['D', 'E', 'F', 'G'].includes(nodeId)) { isCorrect = true; explanation = `${nodeId} adalah Leaf karena berada di paling ujung bawah dan tidak punya anak.`; }
                else explanation = "Leaf berada di paling ujung bawah (D, E, F, atau G).";
            }

            if (isCorrect) {
                // visual feedback
                el.querySelector('circle').setAttribute('fill', '#10b981'); 
                addXP(10);
                showFeedback(true, explanation, "Tepat Sekali!", () => {
                    state.l2_completed++;
                    if (state.l2_completed < l2_tasks.length) {
                        document.getElementById('l2-instruction').innerHTML = l2_tasks[state.l2_completed].instr;
                    } else {
                        awardBadge(BADGES.TREE);
                        document.getElementById('l2-instruction').innerHTML = "Bagus! Kamu sudah mengenali semua komponen Tree.";
                        showNextButton();
                    }
                });
            } else {
                loseLife();
                if(state.lives > 0) {
                    showFeedback(false, explanation, "Bukan yang itu!");
                }
            }
        }

                                    <text x="0" y="4" text-anchor="middle" font-weight="900" fill="white" font-size="14">${l5Data.wAC}</text>
                                </g>
                                <g transform="translate(275, 175)">
                                    <rect x="-15" y="-12" width="30" height="24" fill="#f59e0b" rx="8" />
                                    <text x="0" y="4" text-anchor="middle" font-weight="900" fill="white" font-size="14">${l5Data.wCD}</text>
                                </g>
                                <g transform="translate(200, 125)">
                                    <rect x="-15" y="-12" width="30" height="24" fill="#ef4444" rx="8" />
                                    <text x="0" y="4" text-anchor="middle" font-weight="900" fill="white" font-size="14">${l5Data.wAD}</text>
                                </g>

                                <!-- Nodes -->
                                <circle cx="50" cy="125" r="24" fill="#3b82f6" stroke="#fff" stroke-width="4"/>
                                <text x="50" y="131" text-anchor="middle" fill="white" font-weight="black" font-size="16">A</text>
                                <text x="50" y="165" text-anchor="middle" font-size="12" font-weight="bold" fill="#94a3b8">Rumah</text>

                                <circle cx="200" cy="50" r="20" fill="#94a3b8" stroke="#fff" stroke-width="3"/>
                                <text x="200" y="55" text-anchor="middle" fill="white" font-weight="bold">B</text>

                                <circle cx="200" cy="200" r="20" fill="#94a3b8" stroke="#fff" stroke-width="3"/>
                                <text x="200" y="205" text-anchor="middle" fill="white" font-weight="bold">C</text>

                                <circle cx="350" cy="125" r="24" fill="#10b981" stroke="#fff" stroke-width="4"/>
                                <text x="350" y="131" text-anchor="middle" fill="white" font-weight="black" font-size="16">D</text>
                                <text x="350" y="165" text-anchor="middle" font-size="12" font-weight="bold" fill="#94a3b8">Sekolah</text>
                            </svg>
                        </div>

                        <div class="bg-amber-50 p-6 rounded-[2rem] border-2 border-amber-200 shadow-sm">
                            <h4 class="font-black text-amber-800 mb-4 text-center text-xl flex items-center justify-center">
                                <span class="text-3xl mr-2">🎯</span> Pilih Rute TERPENDEK!
                            </h4>
                            <div class="space-y-4">
                                <button onclick="checkRoute(1)" class="btn-3d w-full text-left px-6 py-4 bg-white rounded-2xl border-2 border-slate-200 hover:border-amber-400 hover:bg-amber-50 font-bold transition flex items-center justify-between text-slate-700">
                                    <span><span class="bg-slate-200 px-2 py-1 rounded text-sm mr-2">1</span> Rute A ➡️ B ➡️ D</span>
                                    <span class="text-sm text-slate-400">Jarak: ${l5Data.c1}</span>
                                </button>
                                <button onclick="checkRoute(2)" class="btn-3d w-full text-left px-6 py-4 bg-white rounded-2xl border-2 border-slate-200 hover:border-amber-400 hover:bg-amber-50 font-bold transition flex items-center justify-between text-slate-700">
                                    <span><span class="bg-slate-200 px-2 py-1 rounded text-sm mr-2">2</span> Rute A ➡️ C ➡️ D</span>
                                    <span class="text-sm text-slate-400">Jarak: ${l5Data.c2}</span>
                                </button>
                                <button onclick="checkRoute(3)" class="btn-3d w-full text-left px-6 py-4 bg-white rounded-2xl border-2 border-slate-200 hover:border-amber-400 hover:bg-amber-50 font-bold transition flex items-center justify-between text-slate-700">
                                    <span><span class="bg-slate-200 px-2 py-1 rounded text-sm mr-2">3</span> Rute Langsung (A ➡️ D)</span>
                                    <span class="text-sm text-slate-400">Jarak: ${l5Data.c3}</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            container.innerHTML = html;
        }

        function checkRoute(choice) {
            const correctChoice = gameVariations[state.groupId].l5.ans;
            if (choice === correctChoice) {
                addXP(20);
                showFeedback(true, "Benar sekali! Menghitung jarak terpendek (Shortest Path) adalah fungsi utama dari Graph yang sering dipakai oleh Google Maps atau Gojek.", "Pemecah Masalah!", () => {
                    awardBadge(BADGES.SOLVER);
                    showNextButton();
                });
            } else {
                loseLife();
                if(state.lives > 0) {
                    showFeedback(false, "Coba cek lagi angkanya. Jumlahkan nilai pada jalur, dan pilih yang hasilnya paling KECIL.");
                }
            }
        }

        function renderLevel6(container) {
            const questions = gameVariations[state.groupId].l6;
            window.l6_currentIndex = 0;
            window.l6_questions = questions;
            renderL6Question(container);
        }

        function renderL6Question(container) {
            if (window.l6_currentIndex >= window.l6_questions.length) {
                showNextButton();
                container.innerHTML = `
                    <div class="max-w-2xl mx-auto text-center slide-up mt-10 p-10 bg-white rounded-[2rem] shadow-xl">
                        <div class="text-7xl mb-4">🎉</div>
                        <h2 class="text-3xl font-black text-slate-800 mb-2">Luar Biasa!</h2>
                        <p class="text-lg text-slate-600">Kamu bisa membedakan Tree dan Graph dengan baik.</p>
                    </div>
                `;
                return;
            }

            const q = window.l6_questions[window.l6_currentIndex];
            
            container.innerHTML = `
                <div class="max-w-3xl mx-auto slide-up pb-10">
                    <div class="text-center mb-6">
                        <span class="bg-rose-100 text-rose-800 font-bold px-4 py-1.5 rounded-full text-sm uppercase tracking-wider">Level 6</span>
                        <h2 class="text-3xl sm:text-4xl font-black text-slate-800 mt-4">⚔️ Tree atau Graph?</h2>
                        <p class="mt-2 text-slate-600">Soal ${window.l6_currentIndex + 1} dari ${window.l6_questions.length}</p>
                    </div>

                    <div class="bg-white p-10 rounded-[2rem] shadow-xl text-center border-t-8 border-rose-500">
                        <div class="text-7xl mb-6 float">${q.icon}</div>
                        <h3 class="text-2xl sm:text-3xl font-black text-slate-800 mb-10">"${q.text}"</h3>
                        
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <button onclick="checkL6Answer('TREE')" class="btn-3d bg-emerald-100 hover:bg-emerald-200 text-emerald-800 font-black py-6 rounded-2xl text-2xl border-b-4 border-emerald-300 flex items-center justify-center">
                                🌳 TREE
                            </button>
                            <button onclick="checkL6Answer('GRAPH')" class="btn-3d bg-blue-100 hover:bg-blue-200 text-blue-800 font-black py-6 rounded-2xl text-2xl border-b-4 border-blue-300 flex items-center justify-center">
                                🗺️ GRAPH
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function checkL6Answer(answer) {
            const q = window.l6_questions[window.l6_currentIndex];
            if (answer === q.answer) {
                addXP(10);
                const reason = answer === 'TREE' ? 'karena datanya memiliki tingkatan atau hirarki.' : 'karena datanya saling terhubung bebas membentuk jaringan.';
                showFeedback(true, `Benar! Struktur ini cocok direpresentasikan dengan ${answer} ${reason}`, "Hebat!", () => {
                    window.l6_currentIndex++;
                    renderL6Question(document.getElementById('game-container'));
                });
            } else {
                loseLife();
                if(state.lives > 0) {
                    showFeedback(false, `Bukan ${answer}. Coba pikirkan apakah ini bentuknya bertingkat atau saling menyambung bebas?`);
                }
            }
        }

        function renderFinalMission(container) {
            const fmData = gameVariations[state.groupId].fm;
            const html = `
                <div class="max-w-4xl mx-auto slide-up pb-10">
                    <div class="text-center mb-8">
                        <span class="bg-purple-100 text-purple-800 font-bold px-4 py-1.5 rounded-full text-sm uppercase tracking-wider">Final Mission</span>
                        <h2 class="text-4xl sm:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-600 to-indigo-600 mt-4 bounce-soft drop-shadow-sm">🏆 DATA MASTER</h2>
                    </div>

                    <div class="bg-white p-8 rounded-[2rem] shadow-xl border-t-8 border-purple-500 relative">
                        <div class="absolute -top-10 right-4 text-7xl float">🏫</div>
                        <p class="text-lg text-slate-700 mb-6 font-medium leading-relaxed max-w-2xl">
                            Sebuah sekolah sedang membangun sistem informasi. Pasangkan dua kebutuhan ini dengan struktur data yang tepat!
                        </p>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-8">
                            <div class="bg-slate-50 p-6 rounded-2xl border-2 border-slate-200 text-center shadow-sm">
                                <div class="bg-blue-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">${fmData.t_icon}</div>
                                <p class="font-bold text-slate-800 mb-4 h-16 flex items-center justify-center">${fmData.t_title}</p>
                                <select id="final-select-1" class="w-full p-4 rounded-xl border-2 border-slate-300 font-bold text-slate-700 focus:outline-none focus:border-purple-500 bg-white cursor-pointer">
                                    <option value="">-- Pilih --</option>
                                    <option value="tree">🌳 TREE</option>
                                    <option value="graph">🗺️ GRAPH</option>
                                </select>
                            </div>
                            
                            <div class="bg-slate-50 p-6 rounded-2xl border-2 border-slate-200 text-center shadow-sm">
                                <div class="bg-green-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">${fmData.g_icon}</div>
                                <p class="font-bold text-slate-800 mb-4 h-16 flex items-center justify-center">${fmData.g_title}</p>
                                <select id="final-select-2" class="w-full p-4 rounded-xl border-2 border-slate-300 font-bold text-slate-700 focus:outline-none focus:border-purple-500 bg-white cursor-pointer">
                                    <option value="">-- Pilih --</option>
                                    <option value="tree">🌳 TREE</option>
                                    <option value="graph">🗺️ GRAPH</option>
                                </select>
                            </div>
                        </div>

                        <div class="mt-10 text-center">
                            <button onclick="checkFinalMission()" class="btn-3d bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-black py-4 px-12 rounded-2xl text-xl border-b-4 border-purple-800 shadow-lg">
                                KUMPULKAN JAWABAN
                            </button>
                        </div>
                    </div>
                </div>
            `;
            container.innerHTML = html;
        }

        function checkFinalMission() {
            const fmData = gameVariations[state.groupId].fm;
            const ans1 = document.getElementById('final-select-1').value;
            const ans2 = document.getElementById('final-select-2').value;

            if (ans1 === fmData.t_ans && ans2 === fmData.g_ans) {
                addXP(50);
                showFeedback(true, "Hal yang memiliki tingkatan direpresentasikan dengan Tree.<br>Sedangkan jaringan koneksi menggunakan Graph.<br><br><strong>Kamu sudah siap untuk Ujian Akhir!</strong>", "Sempurna!", () => {
                    showNextButton();
                });
            } else if (ans1 === '' || ans2 === '') {
                showFeedback(false, "Pilih jawaban untuk kedua studi kasus terlebih dahulu.", "Peringatan");
            } else {
                loseLife();
                if(state.lives > 0) {
                    showFeedback(false, "Masih ada yang tertukar. Ingat prinsipnya: Tree untuk yang bertingkat, Graph untuk yang terhubung bebas.");
                }
            }
        }

        function renderFinalQuiz(container) {
            const questions = gameVariations[state.groupId].quiz;
            window.quiz_data = questions;
            window.quiz_currentIndex = 0;
            state.final_quiz_score = 0; 
            renderQuizQuestion(container);
        }

        function renderQuizQuestion(container) {
            if (window.quiz_currentIndex >= window.quiz_data.length) {
                awardBadge(BADGES.MASTER);
                changeState(GameState.RESULT);
                return;
            }

            const q = window.quiz_data[window.quiz_currentIndex];
            
            let html = `
                <div class="max-w-3xl mx-auto slide-up pb-10">
                    <div class="text-center mb-6">
                        <span class="bg-indigo-900 text-white font-bold px-4 py-1.5 rounded-full text-sm uppercase tracking-wider">🧠 Final Quiz</span>
                        <p class="mt-4 font-bold text-slate-500">Soal ${window.quiz_currentIndex + 1} dari ${window.quiz_data.length}</p>
                    </div>

                    <div class="bg-white p-8 sm:p-10 rounded-[2rem] shadow-xl border-2 border-slate-100">
                        <h3 class="text-xl sm:text-2xl font-black text-slate-800 mb-8 leading-relaxed">${q.q}</h3>
                        <div class="space-y-4">
            `;

            q.options.forEach((opt, index) => {
                html += `
                    <button onclick="checkQuizAnswer(${index})" class="btn-3d w-full text-left px-6 py-4 bg-slate-50 hover:bg-indigo-50 border-2 border-slate-200 hover:border-indigo-400 rounded-xl font-bold text-slate-700 transition">
                        ${String.fromCharCode(65 + index)}. ${opt}
                    </button>
                `;
            });

            html += `
                        </div>
                    </div>
                </div>
            `;
            container.innerHTML = html;
        }

        function checkQuizAnswer(selectedIndex) {
            const q = window.quiz_data[window.quiz_currentIndex];
            if (selectedIndex === q.a) {
                addXP(10);
                state.final_quiz_score++;
                showFeedback(true, "Jawaban kamu benar!", "Tepat!", () => {
                    window.quiz_currentIndex++;
                    renderQuizQuestion(document.getElementById('game-container'));
                });
            } else {
                showFeedback(false, `Jawaban yang benar adalah: <strong>${q.options[q.a]}</strong>`, "Belum Tepat", () => {
                    window.quiz_currentIndex++;
                    renderQuizQuestion(document.getElementById('game-container'));
                });
            }
        }

        function renderResult(container) {
            const percentScore = Math.round((state.final_quiz_score / window.quiz_data.length) * 100);
            
            let title = ""; let subtitle = ""; let icon = "";
            if (percentScore >= 90) { title = "DATA MASTER"; subtitle = "Sempurna! Pemahamanmu sangat luar biasa."; icon = "🏆"; }
            else if (percentScore >= 75) { title = "DATA EXPLORER"; subtitle = "Hebat! Kamu sudah memahami konsep dengan baik."; icon = "🥇"; }
            else if (percentScore >= 60) { title = "DATA ADVENTURER"; subtitle = "Bagus, tapi masih perlu sedikit latihan lagi."; icon = "🥈"; }
            else { title = "DATA BEGINNER"; subtitle = "Jangan menyerah, mari baca lagi materinya dan coba lagi."; icon = "🌱"; }

            let badgesHtml = '';
            if (state.badges.length > 0) {
                state.badges.forEach(b => {
                    badgesHtml += `
                        <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 text-center flex flex-col items-center">
                            <span class="text-3xl mb-1">${b.icon}</span>
                            <span class="font-bold text-xs text-slate-700">${b.name}</span>
                        </div>
                    `;
                });
            } else {
                badgesHtml = `<p class='text-slate-400 italic col-span-3 text-center'>Belum ada badge.</p>`;
            }

            container.innerHTML = `
                <div class="max-w-2xl mx-auto slide-up pb-10 text-center">
                    <div class="text-8xl mb-4 float">${icon}</div>
                    <h2 class="text-4xl font-black text-slate-800 mb-2">${title}</h2>
                    <p class="text-lg text-slate-600 mb-8 font-medium">${subtitle}</p>

                    <div class="bg-white p-8 rounded-[2rem] shadow-xl border-t-8 border-indigo-500 mb-8">
                        <div class="grid grid-cols-2 gap-6 mb-8">
                            <div class="bg-indigo-50 p-4 rounded-2xl">
                                <p class="text-slate-500 font-bold text-sm mb-1">TOTAL XP</p>
                                <p class="text-3xl font-black text-indigo-700">${state.xp}</p>
                            </div>
                            <div class="bg-emerald-50 p-4 rounded-2xl">
                                <p class="text-slate-500 font-bold text-sm mb-1">SKOR KUIS</p>
                                <p class="text-3xl font-black text-emerald-700">${percentScore}%</p>
                            </div>
                        </div>

                        <div class="text-left">
                            <p class="font-bold text-slate-700 mb-3 border-b-2 border-slate-100 pb-2">Koleksi Badge:</p>
                            <div class="grid grid-cols-3 sm:grid-cols-4 gap-3">
                                ${badgesHtml}
                            </div>
                        </div>
                    </div>

                    <div class="flex flex-col sm:flex-row justify-center gap-4">
                        <button onclick="kirimHasilWA()" class="btn-3d bg-green-500 hover:bg-green-600 text-white font-bold py-4 px-8 rounded-xl border-b-4 border-green-700 flex items-center justify-center">
                            <i class="fab fa-whatsapp text-2xl mr-3"></i> Lapor ke Guru
                        </button>
                        <button onclick="resetGame()" class="btn-3d bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-4 px-8 rounded-xl border-b-4 border-slate-400 flex items-center justify-center">
                            <i class="fas fa-redo text-xl mr-3"></i> Main Lagi
                        </button>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
