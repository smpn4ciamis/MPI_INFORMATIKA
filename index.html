        const state = {
            currentState: GameState.HOME,
            playerName: "", 
            groupId: 1, 
            xp: 0, 
            badges: [], 
            
            // Statistik Benar/Salah (Krusial untuk "Next on Wrong")
            correctAnswers: 0,
            wrongAnswers: 0,

            // Tracking progress misi
            l2_completed: 0, 
            l4_completed: 0, 
            
            onFeedbackClose: null,

            timeLeft: 0,

            currentTimeoutCallback: null

        window.onload = function() {
            renderCurrentState();
        };

        // Fungsi mencatat statistik dan XP
        function trackStats(isCorrect, xpReward = 10) {
            if (isCorrect) {
                state.correctAnswers++;
                addXP(xpReward);
                // Animasi centang di HUD
                const el = document.getElementById('hud-correct');
                el.innerText = state.correctAnswers;
                el.parentElement.classList.add('pop');
                setTimeout(() => el.parentElement.classList.remove('pop'), 500);
            } else {
                state.wrongAnswers++;
                // Animasi silang di HUD
                const el = document.getElementById('hud-wrong');
                el.innerText = state.wrongAnswers;
                el.parentElement.classList.add('pop', 'shake');
                setTimeout(() => el.parentElement.classList.remove('pop', 'shake'), 500);
            }
            updateHUD();
        }

        function startTimer(seconds, timeoutCallback) {
            clearInterval(state.timerInterval);
            state.timeLeft = seconds;
            state.currentTimeoutCallback = timeoutCallback;
            document.getElementById('timer-container').classList.remove('hidden-el');
            updateTimerUI();
            
            state.timerInterval = setInterval(() => {
                state.timeLeft--;
                updateTimerUI();
                if (state.timeLeft <= 0) {
                    clearInterval(state.timerInterval);
                    // Jika waktu habis, anggap salah, tunjukkan feedback, lalu lanjut
                    trackStats(false, 0);
                    showFeedback(false, "Kamu terlalu lama berpikir dan kehabisan waktu. Mari kita lanjut ke tantangan berikutnya!", "WAKTU HABIS ⏰", () => {
                        if (state.currentTimeoutCallback) state.currentTimeoutCallback();
                    });
                }
            }, 1000);
        }

        function stopTimer() {
            clearInterval(state.timerInterval);
            document.getElementById('timer-container').classList.add('hidden-el');
        }

        function pauseTimer() {
            clearInterval(state.timerInterval);
        }

        function resumeTimer() {
            if (state.timeLeft > 0 && !document.getElementById('timer-container').classList.contains('hidden-el')) {
                state.timerInterval = setInterval(() => {
                    state.timeLeft--;
                    updateTimerUI();
                    if (state.timeLeft <= 0) {
                        clearInterval(state.timerInterval);
                        trackStats(false, 0);
                        showFeedback(false, "Kamu terlalu lama berpikir dan kehabisan waktu. Mari kita lanjut ke tantangan berikutnya!", "WAKTU HABIS ⏰", () => {
                            if (state.currentTimeoutCallback) state.currentTimeoutCallback();
                        });
                    }
                }, 1000);
            }
        }

        function updateTimerUI() {
            const timerEl = document.getElementById('hud-timer');
            const container = document.getElementById('timer-container');
            
            if (state.timeLeft <= 10 && state.timeLeft > 0) {
                container.classList.remove('bg-blue-100', 'text-blue-700', 'border-blue-200');
                container.classList.add('bg-rose-100', 'text-rose-700', 'border-rose-300', 'pulse-danger');
            } else {
                container.classList.add('bg-blue-100', 'text-blue-700', 'border-blue-200');
                container.classList.remove('bg-rose-100', 'text-rose-700', 'border-rose-300', 'pulse-danger');
            }

            const m = Math.floor(state.timeLeft / 60).toString().padStart(2, '0');
            const s = (state.timeLeft % 60).toString().padStart(2, '0');
            timerEl.innerText = `${m}:${s}`;
        }

        function updateHUD() {
            document.getElementById('hud-name').innerText = state.playerName || "Player";
            document.getElementById('hud-group').innerText = `Klp ${state.groupId}`;
            document.getElementById('hud-xp').innerText = `${state.xp} XP`;
            document.getElementById('hud-badges').innerText = state.badges.length;
            document.getElementById('hud-correct').innerText = state.correctAnswers;
            document.getElementById('hud-wrong').innerText = state.wrongAnswers;
            
            const currentLevelNum = Object.keys(GameState).indexOf(state.currentState) - 1; 
            const progressPercent = Math.max(0, (currentLevelNum / 8) * 100); // Asumsi 8 level
            document.getElementById('hud-progress').style.width = `${progressPercent}%`;

            if (state.currentState !== GameState.HOME && state.currentState !== GameState.RESULT) {
                document.getElementById('hud').classList.remove('hidden-el');
            } else {
                document.getElementById('hud').classList.add('hidden-el');
            }
        }

        function addXP(amount) {
            state.xp += amount;
            const xpEl = document.getElementById('hud-xp');
            xpEl.classList.add('pop', 'text-amber-500');
            setTimeout(() => xpEl.classList.remove('pop', 'text-amber-500'), 500);
            updateHUD();
        }

        function awardBadge(badge) {
            if (!state.badges.find(b => b.id === badge.id)) {
                state.badges.push(badge);
                
                const toast = document.getElementById('toast-badge');
                document.getElementById('toast-icon').innerText = badge.icon;
                document.getElementById('toast-name').innerText = badge.name;
                
                toast.classList.remove('hidden-el');
                setTimeout(() => toast.classList.remove('translate-x-[150%]'), 50);
                
                setTimeout(() => {
                    toast.classList.add('translate-x-[150%]');
                    setTimeout(() => toast.classList.add('hidden-el'), 500);
                }, 4000);
                
                updateHUD();
            }
        }

        function showFeedback(isSuccess, message, title = "", onClose = null) {
            pauseTimer();
            const modal = document.getElementById('feedback-modal');
            const card = document.getElementById('feedback-card');
            const icon = document.getElementById('feedback-icon');
            const titleEl = document.getElementById('feedback-title');
            
            modal.classList.remove('hidden-el');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                card.classList.remove('scale-95');
            }, 10);

            if (isSuccess) {
                card.className = "bg-gradient-to-b from-emerald-50 to-white rounded-[2rem] shadow-2xl p-8 max-w-md w-full mx-4 transform transition-transform duration-300 flex flex-col items-center text-center border-4 border-emerald-400";
                icon.innerHTML = '<i class="fas fa-check-circle text-emerald-500 pop inline-block drop-shadow-md"></i>';
                titleEl.className = "text-3xl font-black text-emerald-700 mb-3";
                titleEl.innerText = title || "Benar Sekali!";
            } else {
                card.className = "bg-gradient-to-b from-rose-50 to-white rounded-[2rem] shadow-2xl p-8 max-w-md w-full mx-4 transform transition-transform duration-300 flex flex-col items-center text-center border-4 border-rose-400 shake";
                icon.innerHTML = '<i class="fas fa-times-circle text-rose-500 pop inline-block drop-shadow-md"></i>';
                titleEl.className = "text-3xl font-black text-rose-700 mb-3";
                titleEl.innerText = title || "Belum Tepat";
            }
            
            document.getElementById('feedback-message').innerHTML = message;
            state.onFeedbackClose = onClose;
        }

        function closeFeedback() {
            const modal = document.getElementById('feedback-modal');
            const card = document.getElementById('feedback-card');
            modal.classList.add('opacity-0');
            card.classList.add('scale-95');
            
            setTimeout(() => {
                modal.classList.add('hidden-el');
                resumeTimer();
                if (state.onFeedbackClose) {
                    state.onFeedbackClose();
                    state.onFeedbackClose = null;
                }
            }, 300);
        }

        function showNextButton() {
            stopTimer();
            document.getElementById('next-container').classList.remove('hidden-el');
        }
        function hideNextButton() {
            document.getElementById('next-container').classList.add('hidden-el');
        }

        function changeState(newState) {
            hideNextButton();
            state.currentState = newState;
            updateHUD();
            renderCurrentState();
        }

        function nextLevel() {
            const states = Object.keys(GameState);
            const currentIndex = states.indexOf(state.currentState);
            if (currentIndex < states.length - 1) changeState(states[currentIndex + 1]);
        }

        function resetGame() {
            stopTimer();
            state.currentState = GameState.HOME;
            state.xp = 0; state.badges = [];
            state.correctAnswers = 0; state.wrongAnswers = 0;
            state.l2_completed = 0; state.l4_completed = 0;
            changeState(GameState.HOME);
        }

        function renderCurrentState() {
            const container = document.getElementById('game-container');
            container.innerHTML = ''; 

            switch(state.currentState) {
                case GameState.HOME: renderHome(container); break;
                case GameState.BRIEFING: renderBriefing(container); break;
                case GameState.LEVEL1: renderLevel1(container); break;
                case GameState.LEVEL2: renderLevel2(container); break;
                case GameState.LEVEL3: renderLevel3(container); break;
                case GameState.LEVEL4: renderLevel4(container); break;
                case GameState.LEVEL5: renderLevel5(container); break;
                case GameState.LEVEL6: renderLevel6(container); break;
                case GameState.FINAL_MISSION: renderFinalMission(container); break;
                case GameState.FINAL_QUIZ: renderFinalQuiz(container); break;
                case GameState.RESULT: renderResult(container); break;
            }
        }

                 renderQuizQuestion(document.getElementById('game-container'));
            });

            const q = window.quiz_data[window.quiz_currentIndex];
            
            let html = `
                <div class="max-w-4xl mx-auto slide-up w-full">
                    <div class="text-center mb-8">
                        <span class="inline-block bg-slate-800 text-white font-black px-5 py-2 rounded-full mb-4 text-sm tracking-widest uppercase shadow-md">Ujian Akhir</span>
                        <h2 class="text-4xl font-black text-slate-800">Kuis Final 🧠</h2>
                        <p class="text-slate-500 font-bold mt-2">Soal ${window.quiz_currentIndex + 1} dari ${window.quiz_data.length}</p>
                    </div>

                    <div class="bg-white p-8 sm:p-12 rounded-[2.5rem] shadow-xl mb-8 border border-slate-100">
                        <h3 class="text-2xl font-black text-slate-800 leading-relaxed">${q.q}</h3>
                    </div>

                    <div class="grid gap-4">
            `;

            q.options.forEach((opt, idx) => {
                html += `
                    <button class="interactive-card bg-slate-50 border-2 border-slate-200 hover:border-indigo-500 hover:bg-indigo-50 hover:text-indigo-800 text-left p-6 rounded-2xl text-xl font-bold text-slate-700 transition-colors w-full flex items-center group" 
                            onclick="checkQuizAnswer(${idx})">
                        <span class="inline-flex items-center justify-center bg-white text-slate-600 rounded-xl w-12 h-12 mr-5 shadow-sm border border-slate-200 group-hover:bg-indigo-500 group-hover:text-white group-hover:border-indigo-600 transition-colors shrink-0 text-xl font-black">
                            ${String.fromCharCode(65+idx)}
                        </span>
                        <span>${opt}</span>
                    </button>
                `;
            });

            html += `</div></div>`;
            container.innerHTML = html;
        }

        window.checkQuizAnswer = function(selectedIndex) {
            const q = window.quiz_data[window.quiz_currentIndex];
            const isCorrect = (selectedIndex === q.a);
            trackStats(isCorrect, 20);
            
            showFeedback(isCorrect, isCorrect ? "Jawaban kamu tepat!" : `Jawaban yang benar adalah: <strong>${q.options[q.a]}</strong>`, isCorrect ? "Benar!" : "Salah", () => {
                window.quiz_currentIndex++;
                renderQuizQuestion(document.getElementById('game-container'));
            });
        };

        function renderResult(container) {
            container.className = "min-h-screen pt-20 pb-20 px-4 sm:px-6 flex flex-col items-center justify-center bg-cyber";
            
            const totalSoal = state.correctAnswers + state.wrongAnswers;
            const percent = totalSoal === 0 ? 0 : Math.round((state.correctAnswers / totalSoal) * 100); 

            let rank = "";
            if (percent >= 90) rank = "🏆 DATA MASTER";
            else if (percent >= 75) rank = "🥇 DATA EXPLORER";
            else if (percent >= 60) rank = "🥈 DATA ADVENTURER";
            else rank = "🌱 DATA BEGINNER";

            let html = `
                <div class="max-w-2xl mx-auto glass-panel p-8 sm:p-12 rounded-[3rem] shadow-2xl text-center slide-up relative overflow-hidden w-full border border-white/20">
                    <div class="text-7xl mb-6 pop drop-shadow-lg">🎉</div>
                    <h2 class="text-4xl sm:text-5xl font-black text-slate-800 mb-3">Petualangan Selesai!</h2>
                    <p class="text-xl text-slate-700 font-black mb-8 bg-white/70 inline-block px-8 py-3 rounded-full shadow-sm border border-white/50">${state.playerName} | Kelompok ${state.groupId}</p>

                    <div class="bg-indigo-50/90 rounded-[2.5rem] p-6 sm:p-10 mb-8 border-4 border-white shadow-xl backdrop-blur-md">
                        <h3 class="text-3xl font-black text-indigo-700 mb-8 drop-shadow-sm">${rank}</h3>
                        
                        <div class="grid grid-cols-2 gap-4 mb-6">
                            <div class="bg-white p-6 rounded-3xl shadow-sm border-2 border-emerald-100 flex flex-col items-center justify-center">
                                <p class="text-emerald-500 text-sm font-black uppercase mb-2 tracking-widest"><i class="fas fa-check-circle"></i> BENAR</p>
                                <p class="text-5xl font-black text-emerald-600 drop-shadow-sm">${state.correctAnswers}</p>
                            </div>
                            <div class="bg-white p-6 rounded-3xl shadow-sm border-2 border-rose-100 flex flex-col items-center justify-center">
                                <p class="text-rose-500 text-sm font-black uppercase mb-2 tracking-widest"><i class="fas fa-times-circle"></i> SALAH</p>
                                <p class="text-5xl font-black text-rose-600 drop-shadow-sm">${state.wrongAnswers}</p>
                            </div>
                        </div>

                        <div class="bg-amber-100 p-5 rounded-2xl mb-6 border-2 border-amber-200">
                             <p class="text-amber-700 text-sm font-black uppercase mb-1 tracking-widest">TOTAL XP</p>
                             <p class="text-4xl font-black text-amber-600 drop-shadow-sm">${state.xp} XP</p>
                        </div>

                        <div class="text-left bg-white p-6 rounded-3xl border-2 border-slate-100 shadow-sm">
                            <p class="text-slate-400 text-sm font-black uppercase mb-4 text-center tracking-widest">Koleksi Badge:</p>
                            <div class="flex flex-wrap justify-center gap-3">
            `;

            if (state.badges.length === 0) {
                html += `<span class='text-slate-400 italic font-semibold'>Belum ada badge</span>`;
            } else {
                state.badges.forEach(b => {
                    html += `<div class="bg-slate-50 px-5 py-3 rounded-xl shadow-sm font-black flex items-center gap-3 border-2 border-slate-200 ${b.color} cursor-default">
                                <span class="text-2xl">${b.icon}</span> <span>${b.name}</span>
                             </div>`;
                });
            }

            html += `
                            </div>
                        </div>
                    </div>

                    <p class="text-slate-700 font-bold text-lg mb-10 leading-relaxed px-4 bg-white/50 p-5 rounded-2xl border border-white/40 shadow-inner">
                        Akurasi kamu adalah <strong>${percent}%</strong>. Semakin sering berlatih, insting berpikir komputasionalmu akan semakin tajam!
                    </p>

                    <button onclick="resetGame()" class="btn-3d btn-primary px-10 py-5 text-xl font-black rounded-full w-full sm:w-auto shadow-2xl flex items-center justify-center gap-3 mx-auto">
                        <i class="fas fa-home text-2xl"></i> KEMBALI KE MENU
                    </button>
                </div>
            `;
            container.innerHTML = html;
        }
    </script>
</body>
</html>
