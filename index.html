<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DATA QUEST: Petualangan Tree & Graph</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1; /* Indigo 500 */
            --primary-dark: #4338ca; /* Indigo 700 */
            --secondary: #10b981; /* Emerald 500 */
            --secondary-dark: #047857; /* Emerald 700 */
            --accent: #f59e0b; /* Amber 500 */
            --text-color: #1e293b; /* Slate 800 */
        }
        
        body {
            font-family: 'Nunito', sans-serif;
            /* Animated Gradient Background */
            background: linear-gradient(-45deg, #0f172a, #312e81, #1e1b4b, #0f172a);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-color);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        h1, h2, h3, h4, h5, h6, .game-title {
            font-family: 'Fredoka', sans-serif;
        }

        #game-container {
            width: 100%;
            max-width: 900px;
            background: #ffffff;
            min-height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
        }

        @media (min-width: 768px) {
            #game-container {
                min-height: 90vh;
                height: 90vh;
                border-radius: 2rem;
                margin: 2rem;
                border: 8px solid rgba(255, 255, 255, 0.1);
                background-clip: padding-box;
            }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        .slide-up { animation: slideUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .bounce-soft { animation: bounceSoft 2s infinite ease-in-out; }
        .pop { animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .float { animation: float 3s ease-in-out infinite; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes bounceSoft { 
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        @keyframes pop {
            0% { transform: scale(0.5); opacity: 0; }
            80% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        /* 3D Button Style */
        .btn-3d {
            transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }
        .btn-3d:active {
            transform: translateY(4px);
            border-bottom-width: 0px !important;
            margin-top: 4px;
        }

        .interactive-card {
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .interactive-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            border-color: var(--primary);
        }

        /* Glassmorphism HUD */
        .glass-hud {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid #e2e8f0;
        }

        /* Feedback Toast */
        #feedback-toast {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 60;
            display: none;
            width: 85%;
            max-width: 350px;
        }
        
        .tree-node circle, .graph-node circle { transition: all 0.3s; }
        .tree-node:hover circle, .graph-node:hover circle { filter: brightness(1.2); stroke-width: 4; }
        .tree-line, .graph-edge { stroke: #cbd5e1; stroke-width: 5; stroke-linecap: round; transition: all 0.3s; }
        .graph-edge:hover { stroke: #f59e0b; stroke-width: 7; cursor: pointer;}
        
        .hidden-el { display: none !important; }
        
        /* Folder Tree Styles */
        .folder-item { 
            cursor: pointer; 
            padding: 10px 14px; 
            border-radius: 12px; 
            transition: all 0.2s; 
            margin-left: 24px;
            display: flex;
            align-items: center;
            font-weight: 600;
            color: #475569;
        }
        .folder-item:hover { background-color: #f1f5f9; transform: translateX(5px); color: #0f172a;}
        .folder-root { margin-left: 0; font-weight: 800; color: #1e293b; font-size: 1.1rem;}
        .folder-icon { font-size: 1.2rem; width: 30px; text-align: center;}
    </style>
</head>
<body>

    <div id="game-container">
        
        <!-- HUD (Heads Up Display) -->
        <div id="hud" class="glass-hud p-4 hidden-el flex-col sm:flex-row justify-between items-center z-10 sticky top-0 shadow-sm">
            <div class="flex items-center space-x-3 mb-3 sm:mb-0 w-full sm:w-auto">
                <div class="bg-indigo-100 text-indigo-800 p-2 rounded-xl shadow-inner">
                    <i class="fas fa-gamepad"></i>
                </div>
                <div class="flex-1 w-full max-w-[200px]">
                    <div class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-1" id="hud-level">Level 1</div>
                    <div class="w-full bg-gray-200 rounded-full h-2.5 shadow-inner">
                        <div id="progress-bar" class="bg-gradient-to-r from-green-400 to-emerald-500 h-2.5 rounded-full transition-all duration-500" style="width: 0%"></div>
                    </div>
                </div>
            </div>
            
            <div class="flex space-x-3 text-sm font-black w-full sm:w-auto justify-center sm:justify-end">
                <div title="Experience Points" class="flex items-center bg-blue-50 px-3 py-1.5 rounded-full border border-blue-200 shadow-sm">
                    <span class="text-xl mr-1">⭐</span> <span id="hud-xp" class="text-blue-700 text-lg">0</span>
                </div>
                <div title="Lives" class="flex items-center bg-red-50 px-3 py-1.5 rounded-full border border-red-200 shadow-sm">
                    <span class="text-xl mr-1">❤️</span> <span id="hud-lives" class="text-red-600 text-lg">3</span>
                </div>
                <div title="Badges" class="flex items-center bg-yellow-50 px-3 py-1.5 rounded-full border border-yellow-200 shadow-sm">
                    <span class="text-xl mr-1">🏆</span> <span id="hud-badges" class="text-yellow-700 text-lg">0</span>
                </div>
            </div>
        </div>

        <!-- Main Content Area -->
        <div id="game-content" class="flex-1 overflow-y-auto p-5 sm:p-8 relative bg-slate-50/50">
            <!-- Screen content will be injected here via JS -->
        </div>

        <!-- Bottom Navigation Bar -->
        <div id="bottom-nav" class="bg-white p-4 border-t-2 border-gray-100 hidden-el flex justify-between items-center sticky bottom-0 z-10">
            <button onclick="confirmRestart()" class="text-slate-400 hover:text-red-500 font-bold px-4 py-2 rounded-xl transition flex items-center group">
                <i class="fas fa-redo mr-2 group-hover:-rotate-180 transition-transform duration-500"></i> Ulang
            </button>
            <button id="btn-next-global" onclick="goToNextState()" class="hidden-el btn-3d bg-gradient-to-b from-indigo-500 to-indigo-600 text-white font-bold py-3 px-8 rounded-2xl border-b-4 border-indigo-800 text-lg flex items-center">
                LANJUT <i class="fas fa-arrow-right ml-2"></i>
            </button>
        </div>

        <!-- Custom Feedback Toast -->
        <div id="feedback-toast" class="bg-white rounded-3xl shadow-2xl p-6 border-b-8 text-center flex flex-col items-center">
            <div id="feedback-icon" class="text-6xl mb-2 -mt-12 bg-white rounded-full p-2 shadow-lg">✅</div>
            <h3 id="feedback-title" class="text-2xl font-black mb-2 mt-2">Benar!</h3>
            <p id="feedback-message" class="text-slate-600 mb-6 text-base font-medium leading-relaxed">Pesan di sini.</p>
            <button id="feedback-btn" onclick="closeFeedback()" class="btn-3d bg-indigo-500 text-white px-8 py-3 rounded-2xl font-bold w-full border-b-4 border-indigo-700 text-lg tracking-wide">OK, Lanjut!</button>
        </div>
        
        <!-- Restart Confirmation Modal -->
        <div id="restart-modal" class="hidden-el absolute inset-0 bg-slate-900/80 backdrop-blur-sm flex justify-center items-center z-50">
            <div class="bg-white p-8 rounded-3xl shadow-2xl max-w-sm w-full mx-4 text-center border-b-8 border-red-500 pop">
                <div class="text-6xl mb-4">⚠️</div>
                <h3 class="text-2xl font-black mb-2 text-slate-800">Mulai Ulang?</h3>
                <p class="mb-8 text-slate-600 font-medium">Semua progress, XP, dan badge akan hilang. Yakin ingin memulai dari awal?</p>
                <div class="flex flex-col space-y-3">
                    <button onclick="resetGame()" class="btn-3d w-full py-3 bg-red-500 text-white rounded-2xl font-bold border-b-4 border-red-700 text-lg">Ya, Mulai Ulang</button>
                    <button onclick="closeRestartModal()" class="w-full py-3 bg-slate-100 text-slate-600 rounded-2xl font-bold hover:bg-slate-200 transition">Batal</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const GameState = {
            HOME: 'HOME', BRIEFING: 'BRIEFING', LEVEL1: 'LEVEL1', LEVEL2: 'LEVEL2',
            LEVEL3: 'LEVEL3', LEVEL4: 'LEVEL4', LEVEL5: 'LEVEL5', LEVEL6: 'LEVEL6',
            FINAL_MISSION: 'FINAL_MISSION', FINAL_QUIZ: 'FINAL_QUIZ', RESULT: 'RESULT'
        };

        const state = {
            currentState: GameState.HOME,
            playerName: "", xp: 0, lives: 3, badges: [], progress: 0,
            l1_completed: 0, l2_completed: 0, l3_completed: false, l4_completed: 0,
            l5_completed: 0, l6_completed: 0, final_quiz_score: 0,
            onFeedbackClose: null 
        };

        const totalLevels = 8;

        const BADGES = {
            BEGINNER: { id: 'beginner', name: 'Data Beginner', icon: '🌱', desc: 'Menyelesaikan Level 1' },
            TREE: { id: 'tree', name: 'Tree Explorer', icon: '🌳', desc: 'Paham struktur Tree' },
            GRAPH: { id: 'graph', name: 'Graph Navigator', icon: '🗺️', desc: 'Paham struktur Graph' },
            SOLVER: { id: 'solver', name: 'Problem Solver', icon: '🧠', desc: 'Pintar cari jalan' },
            MASTER: { id: 'master', name: 'Data Master', icon: '🏆', desc: 'Lulus semua misi!' }
        };

        function updateHUD() {
            if(state.currentState === GameState.HOME || state.currentState === GameState.RESULT) {
                document.getElementById('hud').classList.add('hidden-el');
                document.getElementById('bottom-nav').classList.add('hidden-el');
            } else {
                document.getElementById('hud').classList.remove('hidden-el');
                document.getElementById('bottom-nav').classList.remove('hidden-el');
                
                let levelName = ""; let prog = 0;
                switch(state.currentState) {
                    case GameState.BRIEFING: levelName = "Briefing"; prog = 5; break;
                    case GameState.LEVEL1: levelName = "Level 1: Kenali Data"; prog = 15; break;
                    case GameState.LEVEL2: levelName = "Level 2: Hutan Tree"; prog = 30; break;
                    case GameState.LEVEL3: levelName = "Level 3: Labirin Tree"; prog = 45; break;
                    case GameState.LEVEL4: levelName = "Level 4: Kota Graph"; prog = 60; break;
                    case GameState.LEVEL5: levelName = "Level 5: Cari Rute"; prog = 70; break;
                    case GameState.LEVEL6: levelName = "Level 6: Tree/Graph?"; prog = 80; break;
                    case GameState.FINAL_MISSION: levelName = "Final Mission"; prog = 90; break;
                    case GameState.FINAL_QUIZ: levelName = "Final Quiz"; prog = 95; break;
                }
                
                document.getElementById('hud-level').innerText = levelName;
                document.getElementById('progress-bar').style.width = prog + '%';
                
                // Animate value changes
                animateValue('hud-xp', parseInt(document.getElementById('hud-xp').innerText), state.xp, 500);
                document.getElementById('hud-lives').innerText = state.lives;
                document.getElementById('hud-badges').innerText = state.badges.length;
                
                document.getElementById('btn-next-global').classList.add('hidden-el');
            }
        }

        function animateValue(id, start, end, duration) {
            if (start === end) return;
            let range = end - start;
            let current = start;
            let increment = end > start ? 1 : -1;
            let stepTime = Math.abs(Math.floor(duration / range));
            let obj = document.getElementById(id);
            let timer = setInterval(function() {
                current += increment;
                obj.innerHTML = current;
                if (current == end) {
                    clearInterval(timer);
                    obj.parentElement.classList.add('pop');
                    setTimeout(() => obj.parentElement.classList.remove('pop'), 400);
                }
            }, stepTime);
        }

        function addXP(amount) {
            state.xp += amount;
            updateHUD();
        }

        function loseLife() {
            state.lives--;
            const livesEl = document.getElementById('hud-lives').parentElement;
            livesEl.classList.add('pop', 'bg-red-200');
            setTimeout(() => livesEl.classList.remove('pop', 'bg-red-200'), 500);

            if (state.lives <= 0) {
                showFeedback(false, "Oh tidak! Nyawamu habis. Kamu harus mengulang level ini.", "Game Over", () => {
                    state.lives = 3; 
                    renderCurrentState(); 
                });
            }
        }

        function awardBadge(badgeObj) {
            if (!state.badges.some(b => b.id === badgeObj.id)) {
                state.badges.push(badgeObj);
                showFeedback(true, `<div class="text-4xl my-2">${badgeObj.icon}</div>Kamu mendapatkan badge: <br><strong>${badgeObj.name}</strong><br><span class="text-sm mt-1 block">${badgeObj.desc}</span>`, "🎉 BADGE BARU!", null);
            }
        }

        function showFeedback(isCorrect, message, titleOverride = null, onDismiss = null) {
            const toast = document.getElementById('feedback-toast');
            const icon = document.getElementById('feedback-icon');
            const title = document.getElementById('feedback-title');
            const msg = document.getElementById('feedback-message');
            const btn = document.getElementById('feedback-btn');

            state.onFeedbackClose = onDismiss;

            if (isCorrect) {
                toast.className = "bg-white rounded-3xl shadow-2xl p-6 border-b-8 border-green-500 text-center flex flex-col items-center pop";
                icon.innerHTML = "✅";
                title.innerHTML = titleOverride || "Hebat!";
                title.className = "text-3xl font-black mb-2 mt-2 text-green-600";
                btn.className = "btn-3d bg-green-500 text-white px-8 py-3 rounded-2xl font-bold w-full border-b-4 border-green-700 text-lg";
            } else {
                toast.className = "bg-white rounded-3xl shadow-2xl p-6 border-b-8 border-red-500 text-center flex flex-col items-center pop";
                icon.innerHTML = "❌";
                title.innerHTML = titleOverride || "Belum Tepat";
                title.className = "text-3xl font-black mb-2 mt-2 text-red-600";
                btn.className = "btn-3d bg-red-500 text-white px-8 py-3 rounded-2xl font-bold w-full border-b-4 border-red-700 text-lg";
            }

            msg.innerHTML = message;
            
            const overlay = document.createElement('div');
            overlay.id = 'toast-overlay';
            overlay.className = 'absolute inset-0 bg-slate-900/40 backdrop-blur-sm z-50';
            document.getElementById('game-container').appendChild(overlay);

            toast.style.display = 'flex';
        }

        function closeFeedback() {
            document.getElementById('feedback-toast').style.display = 'none';
            const overlay = document.getElementById('toast-overlay');
            if (overlay) overlay.remove();
            
            if (state.onFeedbackClose) {
                const callback = state.onFeedbackClose;
                state.onFeedbackClose = null;
                callback();
            }
        }

        function changeState(newState) {
            state.currentState = newState;
            renderCurrentState();
        }

        function goToNextState() {
            const states = Object.values(GameState);
            const currentIndex = states.indexOf(state.currentState);
            if (currentIndex < states.length - 1) {
                changeState(states[currentIndex + 1]);
            }
        }

        function showNextButton() {
            const btn = document.getElementById('btn-next-global');
            btn.classList.remove('hidden-el');
            btn.classList.add('pop');
        }

        function confirmRestart() { document.getElementById('restart-modal').classList.remove('hidden-el'); }
        function closeRestartModal() { document.getElementById('restart-modal').classList.add('hidden-el'); }
        function resetGame() {
            closeRestartModal();
            state.currentState = GameState.HOME;
            state.xp = 0; state.lives = 3; state.badges = [];
            state.l1_completed = 0; state.l2_completed = 0; state.l3_completed = false;
            state.l4_completed = 0; state.l5_completed = 0; state.l6_completed = 0;
            state.final_quiz_score = 0;
            renderCurrentState();
        }

        function renderCurrentState() {
            const container = document.getElementById('game-content');
            container.innerHTML = ''; 
            updateHUD();

            switch(state.currentState) {
                case GameState.HOME: renderHome(container); break;
                case GameState.BRIEFING: renderBriefing(container); break;
                case GameState.LEVEL1: renderLevel1(container); break;
                case GameState.LEVEL2: renderLevel2(container); break;
                case GameState.LEVEL3: renderLevel3(container); break;
                case GameState.LEVEL4: renderLevel4(container); break;
                case GameState.LEVEL5: renderLevel5(container); break;
                case GameState.LEVEL6: renderLevel6(container); break;
                case GameState.FINAL_MISSION: renderFinalMission(container); break;
                case GameState.FINAL_QUIZ: renderFinalQuiz(container); break;
                case GameState.RESULT: renderResult(container); break;
            }
            document.getElementById('game-container').scrollTop = 0;
        }

        function renderHome(container) {
            container.innerHTML = `
                <div class="flex flex-col items-center justify-center min-h-[80vh] text-center fade-in py-10">
                    
                    <div class="relative mb-10 float">
                        <div class="absolute inset-0 bg-indigo-500 blur-3xl opacity-20 rounded-full"></div>
                        <div class="relative flex justify-center items-center space-x-4">
                            <div class="bg-white p-4 rounded-3xl shadow-xl transform -rotate-12 border-4 border-indigo-100 text-5xl">🌳</div>
                            <div class="bg-white p-4 rounded-3xl shadow-xl transform rotate-12 border-4 border-pink-100 text-5xl z-10">🗺️</div>
                        </div>
                    </div>

                    <h1 class="text-6xl sm:text-7xl font-black text-transparent bg-clip-text bg-gradient-to-br from-indigo-600 via-purple-600 to-pink-500 game-title bounce-soft tracking-tight drop-shadow-sm">
                        DATA QUEST
                    </h1>
                    <h2 class="text-2xl sm:text-3xl font-bold text-slate-700 mt-4 mb-8 bg-white/50 inline-block px-6 py-2 rounded-full backdrop-blur-sm border border-white">
                        Petualangan Tree & Graph
                    </h2>
                    
                    <div class="bg-slate-800 text-white p-5 rounded-3xl mb-10 max-w-md w-full shadow-2xl relative border-b-4 border-slate-900">
                        <div class="absolute -top-4 -right-4 text-4xl pop">✨</div>
                        <p class="text-lg font-bold">"Susun data. Temukan jalur. Pecahkan masalah!"</p>
                    </div>

                    <div class="mb-10 w-full max-w-sm group">
                        <input type="text" id="player-name-input" placeholder="Masukkan Namamu..." class="w-full px-6 py-4 rounded-2xl border-4 border-indigo-100 focus:border-indigo-500 focus:outline-none text-center text-xl font-bold bg-white/80 backdrop-blur-sm transition-all group-hover:shadow-lg text-slate-700 placeholder-slate-400">
                    </div>

                    <button onclick="startGame()" class="btn-3d bg-gradient-to-b from-indigo-400 to-indigo-600 text-white font-black py-5 px-12 rounded-3xl text-2xl shadow-xl border-b-[6px] border-indigo-800 flex items-center transform hover:scale-105">
                        <i class="fas fa-play mr-4 text-3xl"></i> MULAI MAIN
                    </button>
                    
                </div>
            `;
        }

        function startGame() {
            const nameInput = document.getElementById('player-name-input').value.trim();
            state.playerName = nameInput || "Explorer";
            changeState(GameState.BRIEFING);
        }

        function renderBriefing(container) {
            container.innerHTML = `
                <div class="max-w-2xl mx-auto mt-4 slide-up">
                    <div class="bg-white rounded-[2rem] p-8 sm:p-10 shadow-xl border-2 border-slate-100 relative mt-12">
                        <div class="absolute -top-12 left-1/2 transform -translate-x-1/2 bg-gradient-to-b from-indigo-400 to-indigo-600 text-white w-24 h-24 rounded-full flex items-center justify-center border-4 border-white shadow-lg text-5xl z-10 float">
                            🧑‍💻
                        </div>
                        
                        <div class="text-center mt-12 mb-8">
                            <span class="bg-slate-100 text-slate-500 font-bold px-4 py-1 rounded-full text-sm uppercase tracking-wider">Pesan Masuk</span>
                            <h2 class="text-4xl font-black text-slate-800 mt-4">Briefing Misi</h2>
                        </div>
                        
                        <div class="text-lg text-slate-600 space-y-6 font-medium leading-relaxed">
                            <p class="text-center text-xl">Halo, <strong class="text-indigo-600">${state.playerName}</strong>! Selamat datang di markas <span class="bg-indigo-100 text-indigo-800 px-2 py-1 rounded-lg">Data Explorer</span>.</p>
                            
                            <div class="bg-slate-50 p-6 rounded-2xl border-l-4 border-indigo-500">
                                <p>Dunia digital menyimpan banyak sekali data. Agar tidak berantakan dan mudah dicari, data harus disusun dengan struktur yang tepat.</p>
                            </div>

                            <p class="text-center">Dalam petualangan ini, kamu akan menguasai dua jurus andalan:</p>
                            
                            <div class="flex flex-col sm:flex-row justify-center items-center gap-6 py-2">
                                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex-1 w-full text-center hover:scale-105 transition">
                                    <div class="text-5xl mb-3">🌳</div>
                                    <span class="font-black text-emerald-600 text-xl block">TREE</span>
                                    <span class="text-sm text-slate-500">Struktur Bertingkat</span>
                                </div>
                                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex-1 w-full text-center hover:scale-105 transition">
                                    <div class="text-5xl mb-3">🗺️</div>
                                    <span class="font-black text-pink-600 text-xl block">GRAPH</span>
                                    <span class="text-sm text-slate-500">Jaringan Terhubung</span>
                                </div>
                            </div>

        function checkTreeClick(nodeType, el) {
            const target = window.l2_targetParts[window.l2_currentTargetIndex];
            let isCorrect = false;

            if (target === 'ROOT' && nodeType === 'ROOT') isCorrect = true;
            if (target === 'PARENT' && (nodeType === 'ROOT' || nodeType === 'PARENT_CHILD')) isCorrect = true; 
            if (target === 'CHILD' && (nodeType === 'PARENT_CHILD' || nodeType === 'LEAF_CHILD')) isCorrect = true;
            if (target === 'LEAF' && nodeType === 'LEAF_CHILD') isCorrect = true;

            if (isCorrect) {
                const circle = el.querySelector('circle');
                const origFill = circle.getAttribute('fill');
                circle.setAttribute('fill', 'url(#yellowHighlight)'); 
                
                addXP(10);
                window.l2_currentTargetIndex++;

                if (window.l2_currentTargetIndex >= window.l2_targetParts.length) {
                    showFeedback(true, "Luar biasa! Kamu sudah menguasai anatomi struktur Tree.", "Misi Selesai!", () => {
                        awardBadge(BADGES.TREE);
                        showNextButton();
                    });
                } else {
                    showFeedback(true, `Benar sekali! Itu adalah contoh ${target}.`, "Tepat!", () => {
                        circle.setAttribute('fill', origFill); 
                        
                        const instr = document.getElementById('l2-instruction');
                        instr.innerText = `Temukan: ${window.l2_targetParts[window.l2_currentTargetIndex]}`;
                        instr.classList.remove('pop');
                        void instr.offsetWidth; // trigger reflow
                        instr.classList.add('pop');
                    });
                }
            } else {
                loseLife();
                if (state.lives > 0) {
                    let hint = "";
                    if(target === 'ROOT') hint = "Cari simpul paling atas.";
                    if(target === 'PARENT') hint = "Cari simpul yang memiliki cabang di bawahnya.";
                    if(target === 'CHILD') hint = "Cari simpul yang berasal dari simpul di atasnya.";
                    if(target === 'LEAF') hint = "Cari simpul paling ujung bawah (tanpa cabang).";
                    showFeedback(false, "Coba lagi!<br><br><span class='text-sm bg-yellow-100 px-3 py-1 rounded text-yellow-800 font-bold'>Petunjuk: " + hint + "</span>");
                }
            }
        }

            const target = window.l4_targetParts[window.l4_currentTargetIndex];

                window.l4_currentTargetIndex++;

                    showFeedback(true, "Kerja bagus! Kamu sudah memahami anatomi dasar struktur Graph.", "Misi Selesai!", () => {

                        showNextButton();

                } else {
                    showFeedback(true, `Benar! Itu adalah ${target}.`, "Tepat!", () => {

                        const instr = document.getElementById('l4-instruction');
                        instr.innerText = `Temukan: ${window.l4_targetParts[window.l4_currentTargetIndex]}`;
